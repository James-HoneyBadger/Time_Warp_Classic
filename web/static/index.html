<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Warp Classic - Web IDE</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --border: #3e3e3e;
    --fg: #d4d4d4; --muted: #9d9d9d; --accent: #4caf50; --error: #f14c4c;
    --warn: #e0a030; --mono: "Courier New", Courier, monospace;
    --button: #3e3e3e; --gutter-fg: #6a6a6a; --gutter-bg: #1a1a1a;
    --screen-bg: #0d0d0d; --selection: #264f78;
  }
  * { box-sizing: border-box; }
  html, body { overflow: hidden; }  /* the panes do their own scrolling */
  body {
    margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg); font-family: var(--mono);
  }
  header {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    flex-wrap: wrap;  /* the status line drops to its own row when narrow */
  }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: bold; white-space: nowrap; }
  #language { flex: 0 0 auto; max-width: 190px; }
  #examples { flex: 1 1 160px; min-width: 90px; max-width: 320px; }
  #drafts { flex: 0 0 auto; max-width: 180px; }
  #theme { flex: 0 0 auto; max-width: 150px; }
  select, button {
    background: var(--button); color: var(--fg); border: 1px solid var(--border);
    padding: 4px 8px; font: inherit; border-radius: 3px;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #06220b; font-weight: bold; }
  button.danger:not(:disabled) { background: #8b2a2a; color: #fff; }
  button:disabled { opacity: 0.45; cursor: default; }
  select:focus-visible, button:focus-visible { outline: 2px solid #0a84ff; outline-offset: 1px; }
  #status {
    margin-left: auto; color: var(--muted); font-size: 12px;
    white-space: nowrap; flex: 0 0 auto;
  }
  #status.busy { color: var(--warn); }
  #status.bad { color: var(--error); }
  main { flex: 1; display: flex; min-height: 0; overflow: hidden; }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #divider {
    width: 5px; cursor: col-resize; background: var(--border); flex: 0 0 5px;
    touch-action: none;
  }
  #divider:hover, #divider:focus-visible { background: #5a5a5a; outline: none; }
  .pane h2 {
    margin: 0; padding: 5px 10px; font-size: 12px; font-weight: normal;
    color: var(--muted); background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .pane h2 .spacer { flex: 1; }
  .pane h2 button { padding: 1px 6px; font-size: 11px; }
  .editor { flex: 1; display: flex; min-height: 0; }
  #code-area { position: relative; display: flex; flex: 1; min-width: 0; }
  #highlight {
    position: absolute; inset: 0; margin: 0; padding: 10px 40px 40px 10px;
    overflow: hidden; white-space: pre; pointer-events: none;
    font: inherit; font-size: 13px; line-height: 1.5; tab-size: 4;
    color: var(--fg);
  }
  #code::selection { background: var(--selection); }
  #gutter {
    margin: 0; padding: 10px 6px 40px 10px; text-align: right;
    color: var(--gutter-fg); background: var(--gutter-bg); user-select: none; overflow: hidden;
    font: inherit; line-height: 1.5; font-size: 13px; min-width: 3.2em;
  }
  #gutter .ln { cursor: pointer; }
  #gutter .ln.bp { color: var(--error); font-weight: bold; }
  #code {
    position: relative; flex: 1; resize: none; border: 0; outline: none;
    padding: 10px; background: transparent; color: transparent;
    caret-color: var(--fg); font: inherit; font-size: 13px;
    line-height: 1.5; tab-size: 4; white-space: pre; overflow: auto;
  }
  /* Until the first coloured render arrives, show the textarea's own text. */
  #code-area.plain #code { color: var(--fg); }
  #code-area.plain #highlight { visibility: hidden; }
  #output {
    flex: 1 1 55%; margin: 0; padding: 10px; overflow: auto; white-space: pre-wrap;
    font: inherit; font-size: 13px; line-height: 1.5; min-height: 4em;
    overflow-wrap: anywhere;
  }
  #right-pane { display: flex; flex-direction: column; min-height: 0; }
  #repl {
    display: flex; align-items: center; gap: 6px; padding: 6px 10px;
    background: var(--panel); border-top: 1px solid var(--border);
  }
  #repl .prompt { color: var(--accent); font-weight: bold; min-width: 1ch; }
  #repl.input-mode .prompt { color: var(--warn); }
  #repl.input-mode #repl-input { border-color: var(--warn); }
  #repl-input {
    flex: 1; min-width: 0; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 3px; padding: 4px 6px;
    font: inherit; font-size: 13px; outline: none;
  }
  #repl-input:focus { border-color: #0a84ff; }
  #graphics {
    flex: 0 0 45%; display: flex; flex-direction: column; min-height: 0;
    border-top: 1px solid var(--border);
  }
  #screen-wrap {
    flex: 1; min-height: 0; display: flex; align-items: center;
    justify-content: center; background: var(--screen-bg); overflow: hidden;
  }
  #screen {
    width: 100%; height: 100%; object-fit: contain;
    image-rendering: pixelated;
    background: #ffffff; box-shadow: 0 0 0 1px var(--border);
  }
  #output .err { color: var(--error); }
  #output .hint-line { color: var(--muted); font-style: italic; }
  #output .echo { color: var(--accent); }
  #output .note { color: var(--muted); }
  .hint { padding: 2px 10px; color: var(--muted); font-size: 11px;
          background: var(--panel); border-top: 1px solid var(--border);
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  kbd { font: inherit; border: 1px solid var(--border); border-radius: 2px; padding: 0 3px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden;
                     clip: rect(0 0 0 0); white-space: nowrap; }

  /* Phones and narrow windows: stack the editor above the console. */
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #divider { display: none; }
    #left-pane { flex: 1 1 45% !important; }
    #right-pane { flex: 1 1 55%; }
    #status { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>TIME WARP CLASSIC</h1>
  <select id="language" title="Language" aria-label="Language"></select>
  <button id="run" class="primary" title="Run (Ctrl+Enter)">&#9654; Run</button>
  <button id="stop" class="danger" title="Stop (Ctrl+.)" disabled>&#9632; Stop</button>
  <button id="pause" title="Pause between lines" disabled>&#10074;&#10074; Pause</button>
  <button id="step" title="Run one more line" disabled>&#10522; Step</button>
  <select id="examples" title="Load an example" aria-label="Load an example">
    <option value="">Examples&hellip;</option>
  </select>
  <button id="open" title="Open a program from your computer">Open&hellip;</button>
  <button id="save" title="Download the program (Ctrl+S)">Save</button>
  <select id="drafts" title="Server-side drafts" aria-label="Server-side drafts">
    <option value="">Drafts&hellip;</option>
  </select>
  <input id="draft-name" placeholder="draft name" autocomplete="off" spellcheck="false"
         aria-label="Draft name" style="width: 120px">
  <button id="save-draft" title="Save the program as a server-side draft">Save draft</button>
  <button id="delete-draft" title="Delete the selected draft">Delete draft</button>
  <select id="theme" title="Colour theme" aria-label="Colour theme"></select>
  <input id="open-file" type="file" class="visually-hidden" tabindex="-1" aria-hidden="true">
  <span id="status" role="status" aria-live="polite">ready</span>
</header>
<main>
  <section class="pane" id="left-pane">
    <h2>Program</h2>
    <div class="editor">
      <pre id="gutter" aria-hidden="true">1</pre>
      <div id="code-area" class="plain">
        <pre id="highlight" aria-hidden="true"></pre>
        <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off"
          aria-label="Program source">10 PRINT "HELLO FROM THE BROWSER"
20 FOR I = 1 TO 3
30 PRINT "COUNT "; I
40 NEXT I
</textarea>
      </div>
    </div>
    <div class="hint"><kbd>Ctrl+Enter</kbd> run &middot; <kbd>Ctrl+.</kbd> stop &middot;
      <kbd>Ctrl+S</kbd> save &middot; your work is kept in this browser between visits</div>
  </section>
  <div id="divider" role="separator" aria-orientation="vertical" tabindex="0"
       aria-valuemin="15" aria-valuemax="85" aria-valuenow="50"
       aria-label="Resize the editor" title="Drag (or use the arrow keys) to resize"></div>
  <section class="pane" id="right-pane">
    <h2>Console <span class="spacer"></span>
      <button id="clear" title="Clear the console">Clear</button></h2>
    <pre id="output" aria-label="Program output" aria-live="polite"></pre>
    <div id="repl">
      <label class="prompt" id="repl-prompt" for="repl-input">&gt;</label>
      <input id="repl-input" autocomplete="off" spellcheck="false" autocapitalize="off"
             placeholder="Type a statement and press Enter">
    </div>
    <div id="graphics">
      <h2>Graphics <span class="spacer"></span>
        <button id="save-png" title="Save the drawing as a PNG">Save PNG</button></h2>
      <div id="screen-wrap"><canvas id="screen" width="600" height="400"
        role="img" aria-label="Turtle graphics output"></canvas></div>
    </div>
  </section>
</main>
<script>
(function () {
  "use strict";

  const STORE_KEY = "timewarp.web.v1";

  const languageSelect = document.getElementById("language");
  const examplesSelect = document.getElementById("examples");
  const code = document.getElementById("code");
  const codeArea = document.getElementById("code-area");
  const gutter = document.getElementById("gutter");
  const output = document.getElementById("output");
  const runButton = document.getElementById("run");
  const stopButton = document.getElementById("stop");
  const openButton = document.getElementById("open");
  const openFile = document.getElementById("open-file");
  const saveSourceButton = document.getElementById("save");
  const clearButton = document.getElementById("clear");
  const status = document.getElementById("status");
  const highlightLayer = document.getElementById("highlight");
  const screen = document.getElementById("screen");
  const screenCtx = screen.getContext("2d");
  const saveButton = document.getElementById("save-png");
  const replBar = document.getElementById("repl");
  const replInput = document.getElementById("repl-input");
  const replPrompt = document.getElementById("repl-prompt");
  const pauseButton = document.getElementById("pause");
  const stepButton = document.getElementById("step");
  const themeSelect = document.getElementById("theme");
  const draftsSelect = document.getElementById("drafts");
  const saveDraftButton = document.getElementById("save-draft");
  const deleteDraftButton = document.getElementById("delete-draft");
  const draftName = document.getElementById("draft-name");

  let languages = [];          // entries from /api/languages
  let activeRun = null;        // { id, controller } while a program runs
  let savedSource = null;      // text last loaded/saved, to warn before replacing edits
  let breakpoints = new Set(); // 1-based editor line numbers
  let paused = false;          // whether the active run is paused

  function newId(prefix) {
    return (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : prefix + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  function setStatus(text, tone) {
    status.textContent = text;
    status.className = tone || "";
  }

  // ---- colour themes ---------------------------------------------------
  // Mirrors the desktop themes in gui/themes.py.
  const THEMES = {
    dark: { name: "Dark", bg: "#1e1e1e", panel: "#252526", border: "#3e3e3e",
            fg: "#d4d4d4", muted: "#9d9d9d", accent: "#4caf50", error: "#f14c4c",
            warn: "#e0a030", button: "#3e3e3e", gutterFg: "#6a6a6a",
            gutterBg: "#1a1a1a", screenBg: "#0d0d0d", selection: "#264f78" },
    light: { name: "Light", bg: "#ffffff", panel: "#f0f0f0", border: "#cccccc",
             fg: "#111111", muted: "#6a6a6a", accent: "#2e7d32", error: "#c62828",
             warn: "#b07d10", button: "#e7e7e7", gutterFg: "#8a8a8a",
             gutterBg: "#f5f5f5", screenBg: "#d9d9d9", selection: "#b3d4fc" },
    classic: { name: "Classic", bg: "#fffef0", panel: "#e0e0e0", border: "#cccccc",
               fg: "#111111", muted: "#6a6a6a", accent: "#2e7d32", error: "#c62828",
               warn: "#b07d10", button: "#e0e0e0", gutterFg: "#8a8a8a",
               gutterBg: "#eee9d8", screenBg: "#d9d4c0", selection: "#b3d4fc" },
    solarized_dark: { name: "Solarized Dark", bg: "#002b36", panel: "#073642",
               border: "#586e75", fg: "#839496", muted: "#657b83",
               accent: "#859900", error: "#dc322f", warn: "#b58900",
               button: "#073642", gutterFg: "#586e75", gutterBg: "#073642",
               screenBg: "#073642", selection: "#2aa198" },
    solarized_light: { name: "Solarized Light", bg: "#fdf6e3", panel: "#eee8d5",
               border: "#93a1a1", fg: "#657b83", muted: "#839496",
               accent: "#859900", error: "#dc322f", warn: "#b58900",
               button: "#eee8d5", gutterFg: "#93a1a1", gutterBg: "#fdf6e3",
               screenBg: "#eee8d5", selection: "#b3d4fc" },
    monokai: { name: "Monokai", bg: "#272822", panel: "#3e3d32", border: "#75715e",
               fg: "#f8f8f2", muted: "#a6a69d", accent: "#a6e22e", error: "#f92672",
               warn: "#e6db74", button: "#3e3d32", gutterFg: "#75715e",
               gutterBg: "#272822", screenBg: "#3e3d32", selection: "#49483e" },
    dracula: { name: "Dracula", bg: "#282a36", panel: "#44475a", border: "#6272a4",
               fg: "#f8f8f2", muted: "#a1a1b5", accent: "#50fa7b", error: "#ff5555",
               warn: "#f1fa8c", button: "#44475a", gutterFg: "#6272a4",
               gutterBg: "#282a36", screenBg: "#44475a", selection: "#6272a4" },
    nord: { name: "Nord", bg: "#2e3440", panel: "#3b4252", border: "#4c566a",
            fg: "#d8dee9", muted: "#9aa7bd", accent: "#a3be8c", error: "#bf616a",
            warn: "#ebcb8b", button: "#3b4252", gutterFg: "#4c566a",
            gutterBg: "#2e3440", screenBg: "#3b4252", selection: "#5e81ac" },
    high_contrast: { name: "High Contrast", bg: "#000000", panel: "#000000",
            border: "#ffffff", fg: "#ffffff", muted: "#c0c0c0", accent: "#00ff00",
            error: "#ff5555", warn: "#ffff55", button: "#000000", gutterFg: "#ffffff",
            gutterBg: "#000000", screenBg: "#0a0a0a", selection: "#ffff00" }
  };

  function applyTheme(key) {
    const theme = THEMES[key] || THEMES.dark;
    const root = document.documentElement.style;
    root.setProperty("--bg", theme.bg);
    root.setProperty("--panel", theme.panel);
    root.setProperty("--border", theme.border);
    root.setProperty("--fg", theme.fg);
    root.setProperty("--muted", theme.muted);
    root.setProperty("--accent", theme.accent);
    root.setProperty("--error", theme.error);
    root.setProperty("--warn", theme.warn);
    root.setProperty("--button", theme.button);
    root.setProperty("--gutter-fg", theme.gutterFg);
    root.setProperty("--gutter-bg", theme.gutterBg);
    root.setProperty("--screen-bg", theme.screenBg);
    root.setProperty("--selection", theme.selection);
    themeSelect.value = key;
    try { localStorage.setItem("timewarp.web.theme", key); } catch (err) { /* ignore */ }
  }

  function initThemes() {
    Object.keys(THEMES).forEach(function (key) {
      const option = document.createElement("option");
      option.value = key;
      option.textContent = THEMES[key].name;
      themeSelect.appendChild(option);
    });
    let saved = null;
    try { saved = localStorage.getItem("timewarp.web.theme"); } catch (err) { /* ignore */ }
    applyTheme(THEMES[saved] ? saved : "dark");
  }

  // Output is batched (a timer rather than requestAnimationFrame, which
  // stalls in background tabs) and the console keeps only the most recent
  // lines, so a tight PRINT loop cannot freeze the tab.
  const MAX_CONSOLE_LINES = 5000;
  let pendingLines = [];
  let flushScheduled = false;

  function lineClass(value, kind) {
    if (kind) return kind;
    if (value.indexOf("?HINT:") === 0) return "hint-line";
    if (value.charAt(0) === "?") return "err";
    return "";
  }

  function flushOutput() {
    flushScheduled = false;
    if (!pendingLines.length) return;
    const batch = pendingLines.length > MAX_CONSOLE_LINES
      ? pendingLines.slice(-MAX_CONSOLE_LINES) : pendingLines;
    pendingLines = [];
    const stick = output.scrollHeight - output.scrollTop - output.clientHeight < 40;
    const fragment = document.createDocumentFragment();
    batch.forEach(function (entry) {
      const line = document.createElement("span");
      line.textContent = entry.text + "\n";
      if (entry.kind) line.className = entry.kind;
      fragment.appendChild(line);
    });
    output.appendChild(fragment);
    let excess = output.childElementCount - MAX_CONSOLE_LINES;
    while (excess-- > 0) output.removeChild(output.firstChild);
    if (stick) output.scrollTop = output.scrollHeight;
  }

  function appendLine(text, kind) {
    const value = String(text);
    pendingLines.push({ text: value, kind: lineClass(value, kind) });
    if (pendingLines.length > MAX_CONSOLE_LINES * 2) {
      pendingLines = pendingLines.slice(-MAX_CONSOLE_LINES);
    }
    if (!flushScheduled) {
      flushScheduled = true;
      setTimeout(flushOutput, 30);
    }
  }

  function clearOutput() {
    pendingLines = [];
    output.textContent = "";
  }

  function lastOutputLine() {
    if (pendingLines.length) return pendingLines[pendingLines.length - 1].text;
    const last = output.lastElementChild;
    return last ? last.textContent.trim() : "";
  }

  // ---- graphics canvas -------------------------------------------------
  // The server sends run-length encoded palette indices for the rectangle
  // that changed, plus a small vector overlay for the turtle marker, tagged
  // shapes and text.
  const colourProbe = document.createElement("canvas").getContext("2d");
  const colourCache = new Map();
  let canvasImage = null;
  let canvasSize = { width: 0, height: 0 };

  function cssColour(name) {
    // Tk accepts "light blue" and "Gray50"; CSS wants "lightblue" / "gray".
    return String(name).trim().toLowerCase().replace(/\s+/g, "")
      .replace(/^(gr[ae]y)\d+$/, "$1");
  }

  function resolveColour(css) {
    if (!css) return null;
    if (colourCache.has(css)) return colourCache.get(css);
    colourProbe.fillStyle = "#000000";
    colourProbe.fillStyle = cssColour(css);
    const hex = colourProbe.fillStyle;
    let rgb = null;
    if (typeof hex === "string" && hex.slice(0, 1) === "#") {
      rgb = [
        parseInt(hex.slice(1, 3), 16),
        parseInt(hex.slice(3, 5), 16),
        parseInt(hex.slice(5, 7), 16)
      ];
    }
    colourCache.set(css, rgb);
    return rgb;
  }

  function resetCanvas() {
    canvasImage = null;
    screenCtx.fillStyle = "#ffffff";
    screenCtx.fillRect(0, 0, screen.width, screen.height);
  }

  function ensureCanvasImage(frame) {
    if (canvasImage && canvasSize.width === frame.width &&
        canvasSize.height === frame.height) {
      return;
    }
    canvasSize = { width: frame.width, height: frame.height };
    screen.width = frame.width;
    screen.height = frame.height;
    canvasImage = screenCtx.createImageData(frame.width, frame.height);
    const background = resolveColour(frame.palette[0]) || [255, 255, 255];
    const data = canvasImage.data;
    for (let offset = 0; offset < data.length; offset += 4) {
      data[offset] = background[0];
      data[offset + 1] = background[1];
      data[offset + 2] = background[2];
      data[offset + 3] = 255;
    }
  }

  function applyRle(frame) {
    if (!frame.rle || frame.w <= 0 || frame.h <= 0) return;
    const bytes = Uint8Array.from(atob(frame.rle), function (char) {
      return char.charCodeAt(0);
    });
    const palette = frame.palette.map(resolveColour);
    const data = canvasImage.data;
    const right = frame.x + frame.w;
    let cursor = 0;
    let column = frame.x;
    let row = frame.y;
    while (cursor + 2 < bytes.length) {
      const run = bytes[cursor] | (bytes[cursor + 1] << 8);
      const rgb = palette[bytes[cursor + 2]] || [0, 0, 0];
      cursor += 3;
      for (let step = 0; step < run; step += 1) {
        if (row < canvasSize.height && column < right) {
          const offset = (row * canvasSize.width + column) * 4;
          data[offset] = rgb[0];
          data[offset + 1] = rgb[1];
          data[offset + 2] = rgb[2];
          data[offset + 3] = 255;
        }
        column += 1;
        if (column >= right) {
          column = frame.x;
          row += 1;
        }
      }
    }
  }

  function paint(item) {
    if (item.fill) {
      screenCtx.fillStyle = cssColour(item.fill);
      screenCtx.fill();
    }
    if (item.outline) {
      screenCtx.strokeStyle = cssColour(item.outline);
      screenCtx.lineWidth = item.width || 1;
      screenCtx.stroke();
    }
  }

  function drawOverlay(items) {
    (items || []).forEach(function (item) {
      if (item.kind === "text") {
        screenCtx.fillStyle = cssColour(item.fill || "#000000");
        screenCtx.font = (item.size || 12) + "px 'Courier New', monospace";
        screenCtx.textBaseline = "top";
        screenCtx.fillText(item.text, item.x, item.y);
        return;
      }
      const points = item.points || [];
      if (points.length < 2) return;
      screenCtx.beginPath();
      if (item.kind === "oval" || item.kind === "rectangle") {
        // Two corners of a bounding box, not a path.
        const x = Math.min(points[0][0], points[1][0]);
        const y = Math.min(points[0][1], points[1][1]);
        const w = Math.abs(points[1][0] - points[0][0]);
        const h = Math.abs(points[1][1] - points[0][1]);
        if (item.kind === "oval") {
          screenCtx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
        } else {
          screenCtx.rect(x, y, w, h);
        }
        paint(item);
        return;
      }
      screenCtx.moveTo(points[0][0], points[0][1]);
      for (let index = 1; index < points.length; index += 1) {
        screenCtx.lineTo(points[index][0], points[index][1]);
      }
      if (item.kind === "line") {
        paint({ outline: item.outline || item.fill, width: item.width });
        return;
      }
      if (points.length > 2) screenCtx.closePath();
      paint(item);
    });
  }

  function applyCanvasFrame(frame) {
    ensureCanvasImage(frame);
    applyRle(frame);
    screenCtx.putImageData(canvasImage, 0, 0);
    drawOverlay(frame.overlay);
  }

  // ---- editor: gutter, highlighting, persistence -----------------------
  // The server renders Pygments tokens to HTML; the textarea on top is
  // transparent, so it only shows the caret and the selection.  Until a
  // render for the current text exists the textarea shows its own text.
  let highlightTimer = null;
  let highlightState = { language: null, program: null };
  let highlightRequest = 0;

  function syncScroll() {
    highlightLayer.scrollTop = code.scrollTop;
    highlightLayer.scrollLeft = code.scrollLeft;
    gutter.scrollTop = code.scrollTop;
  }

  function showPlain() {
    codeArea.classList.add("plain");
  }

  async function refreshHighlight() {
    const language = languageSelect.value;
    const program = code.value;
    if (highlightState.language === language && highlightState.program === program) {
      codeArea.classList.remove("plain");
      return;
    }
    const ticket = ++highlightRequest;
    try {
      const response = await fetch("/api/highlight", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ language: language, program: program })
      });
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      // A newer keystroke may have arrived while this was in flight.
      if (ticket !== highlightRequest || code.value !== program ||
          languageSelect.value !== language) return;
      highlightLayer.innerHTML = data.html + "\n";
      highlightState = { language: language, program: program };
      codeArea.classList.remove("plain");
      syncScroll();
    } catch (err) {
      // Never leave the text invisible: fall back to the textarea's own text.
      if (ticket === highlightRequest) showPlain();
    }
  }

  function scheduleHighlight(delay) {
    if (highlightTimer) clearTimeout(highlightTimer);
    highlightTimer = setTimeout(refreshHighlight, delay === undefined ? 150 : delay);
  }

  let gutterCount = 0;
  function syncGutter() {
    const count = code.value.split("\n").length;
    if (gutterCount === count) return;
    gutterCount = count;
    gutter.textContent = "";
    const fragment = document.createDocumentFragment();
    for (let i = 1; i <= count; i += 1) {
      const line = document.createElement("span");
      line.className = "ln" + (breakpoints.has(i) ? " bp" : "");
      line.textContent = i + "\n";
      line.dataset.line = String(i);
      fragment.appendChild(line);
    }
    gutter.appendChild(fragment);
    syncScroll();
  }

  function jumpToLine(lineNumber) {
    const lines = code.value.split("\n");
    const target = Math.min(Math.max(1, lineNumber), lines.length);
    let offset = 0;
    for (let i = 0; i < target - 1; i += 1) offset += lines[i].length + 1;
    code.focus({ preventScroll: true });
    code.setSelectionRange(offset, offset);
    const lineHeight = 1.5 * 13;
    code.scrollTop = Math.max(0, (target - 1) * lineHeight - code.clientHeight / 3);
    syncScroll();
  }

  gutter.addEventListener("click", function (event) {
    const line = event.target && event.target.dataset && event.target.dataset.line;
    if (!line) return;
    const number = parseInt(line, 10);
    if (breakpoints.has(number)) breakpoints.delete(number);
    else breakpoints.add(number);
    gutterCount = 0;  // force a re-render with the new marker
    syncGutter();
  });

  let persistTimer = null;
  function persist() {
    if (persistTimer) clearTimeout(persistTimer);
    persistTimer = setTimeout(function () {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({
          language: languageSelect.value, program: code.value
        }));
      } catch (err) { /* private mode or storage full: nothing to do */ }
      updateShareHash();
    }, 300);
  }

  // ---- share / permalink ----------------------------------------------
  // The program and language are encoded into the URL hash so a program can
  // be shared as a link. history.replaceState keeps it out of the back stack.
  function updateShareHash() {
    // Only small programs make a sane URL; big ones still autosave locally.
    if (code.value.length > 8192) return;
    try {
      const payload = encodeURIComponent(JSON.stringify({
        language: languageSelect.value, program: code.value
      }));
      history.replaceState(null, "", "#" + payload);
    } catch (err) { /* a huge program still saves locally */ }
  }

  function shareFromHash() {
    if (location.hash.length <= 1) return null;
    try {
      return JSON.parse(decodeURIComponent(location.hash.slice(1)));
    } catch (err) {
      return null;
    }
  }

  function restore() {
    try {
      return JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    } catch (err) {
      return null;
    }
  }

  // Replace the buffer as one undoable edit where the browser allows it.
  function setProgram(text) {
    const focused = document.activeElement;
    code.focus({ preventScroll: true });
    code.select();
    let replaced = false;
    try { replaced = document.execCommand("insertText", false, text); } catch (err) { /* old API */ }
    if (!replaced || code.value !== text) code.value = text;
    code.setSelectionRange(0, 0);
    code.scrollTop = 0;
    onEdited();
    if (focused && focused !== code && focused.focus) focused.focus();
  }

  function onEdited() {
    if (highlightState.program !== code.value) showPlainSoon();
    syncGutter();
    scheduleHighlight();
    persist();
  }

  // Keep the coloured layer while typing; fall back to plain text only if
  // the new colours are slow to arrive, so text is never hidden for long.
  let plainTimer = null;
  function showPlainSoon() {
    if (plainTimer) clearTimeout(plainTimer);
    plainTimer = setTimeout(function () {
      if (highlightState.program !== code.value) showPlain();
    }, 600);
  }

  function isDirty() {
    return savedSource !== null && code.value !== savedSource && code.value.trim() !== "";
  }

  function confirmReplace() {
    return !isDirty() || window.confirm("Replace the program in the editor? Unsaved changes will be lost.");
  }

  // ---- languages and examples -----------------------------------------

  function languageEntry(name) {
    for (let i = 0; i < languages.length; i += 1) {
      if (languages[i].name === name) return languages[i];
    }
    return null;
  }

  function setLanguage(name) {
    if (!languageEntry(name) || languageSelect.value === name) return;
    languageSelect.value = name;
    onLanguageChanged();
  }

  function onLanguageChanged() {
    const entry = languageEntry(languageSelect.value);
    updatePrompt();
    scheduleHighlight(0);
    persist();
    if (entry && entry.available === false) {
      setStatus(entry.name + " needs its runtime installed on the server", "bad");
    } else {
      setStatus("ready");
    }
  }

  async function loadLanguages(preferred) {
    const response = await fetch("/api/languages");
    const data = await response.json();
    languages = data.languages || [];
    languageSelect.innerHTML = "";
    languages.forEach(function (entry) {
      const option = document.createElement("option");
      option.value = entry.name;
      option.textContent = entry.name;
      if (entry.available === false) {
        option.textContent = entry.name + " (runtime missing)";
        option.title = entry.name + " needs its runtime installed on the server";
      }
      languageSelect.appendChild(option);
    });
    languageSelect.value = languageEntry(preferred) ? preferred : "BASIC";
    onLanguageChanged();
  }

  async function loadExamples() {
    const response = await fetch("/api/examples");
    const data = await response.json();
    data.examples.forEach(function (entry) {
      const option = document.createElement("option");
      option.value = entry.path;
      option.dataset.language = entry.language;
      option.textContent = entry.name;
      examplesSelect.appendChild(option);
    });
  }

  async function openExample(path) {
    if (!path) return;
    const option = examplesSelect.selectedOptions[0];
    examplesSelect.value = "";  // so picking the same example again reloads it
    if (!confirmReplace()) return;
    try {
      const response = await fetch("/api/examples/" +
        path.split("/").map(encodeURIComponent).join("/"));
      const data = await response.json();
      if (!response.ok || data.error) {
        setStatus(data.error || ("HTTP " + response.status), "bad");
        return;
      }
      if (option && option.dataset.language) setLanguage(option.dataset.language);
      setProgram(data.source);
      savedSource = data.source;
      setStatus("loaded " + path);
    } catch (err) {
      setStatus("could not load example: " + err.message, "bad");
    }
  }

  function extensionFor(name) {
    const entry = languageEntry(name);
    return (entry && entry.extension) || ".txt";
  }

  function languageForFile(filename) {
    const dot = filename.lastIndexOf(".");
    if (dot < 0) return null;
    const ext = filename.slice(dot).toLowerCase();
    for (let i = 0; i < languages.length; i += 1) {
      if (String(languages[i].extension).toLowerCase() === ext) return languages[i].name;
    }
    const aliases = { ".bas": "BASIC", ".pas": "Pascal", ".pl": "Perl", ".py": "Python",
                      ".js": "JavaScript", ".fth": "Forth", ".4th": "Forth", ".logo": "Logo",
                      ".lgo": "Logo", ".pilot": "PILOT", ".pro": "Prolog" };
    return aliases[ext] || null;
  }

  function downloadSource() {
    const blob = new Blob([code.value], { type: "text/plain;charset=utf-8" });
    const link = document.createElement("a");
    link.download = "program" + extensionFor(languageSelect.value);
    link.href = URL.createObjectURL(blob);
    link.click();
    setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
    savedSource = code.value;
    setStatus("saved " + link.download);
  }

  openButton.addEventListener("click", function () { openFile.click(); });
  openFile.addEventListener("change", function () {
    const file = openFile.files && openFile.files[0];
    openFile.value = "";
    if (!file || !confirmReplace()) return;
    if (file.size > 256 * 1024) {
      setStatus(file.name + " is larger than the 256 KB program limit", "bad");
      return;
    }
    file.text().then(function (text) {
      const language = languageForFile(file.name);
      if (language) setLanguage(language);
      setProgram(text);
      savedSource = text;
      setStatus("opened " + file.name);
    });
  });
  saveSourceButton.addEventListener("click", downloadSource);

  // ---- running programs ------------------------------------------------

  function setRunning(running) {
    runButton.disabled = running;
    stopButton.disabled = !running;
    pauseButton.disabled = !running;
    stepButton.disabled = !running;
    languageSelect.disabled = running;
    if (!running) { paused = false; updatePauseLabel(); }
    updatePrompt();
  }

  function updatePauseLabel() {
    pauseButton.textContent = paused ? "\u25B6 Resume" : "\u275A\u275A Pause";
  }

  function handleFrame(frame, run) {
    let event = "message";
    let payload = "";
    frame.split("\n").forEach(function (line) {
      if (line.startsWith("event:")) event = line.slice(6).trim();
      else if (line.startsWith("data:")) payload += line.slice(5).trim();
    });
    if (!payload) return;  // ":" comments are keep-alives
    const data = JSON.parse(payload);
    if (event === "start") return;
    if (event === "done") {
      run.done = true;
      const issues = data.errors > 0;
      let text;
      if (data.stopped) text = "stopped after " + data.seconds.toFixed(2) + "s";
      else if (data.interrupted && !data.timed_out) text = "breakpoint after " + data.seconds.toFixed(2) + "s";
      else if (data.timed_out) text = "time limit reached after " + data.seconds.toFixed(2) + "s";
      else if (data.output_capped) text = "output limit reached after " + data.seconds.toFixed(2) + "s";
      else text = "finished in " + data.seconds.toFixed(2) + "s" + (issues ? " (with errors)" : "");
      setStatus(text, (issues || data.timed_out || data.output_capped || data.interrupted) ? "bad" : "");
      return;
    }
    if (event === "error") {
      run.done = true;
      appendLine(data.error, "err");
      setStatus("error", "bad");
      return;
    }
    if (event === "canvas") {
      applyCanvasFrame(data);
      return;
    }
    if (event === "input") {
      run.waiting = true;
      // BASIC prints its prompt as a line and passes none; use that line.
      run.prompt = data.prompt || lastOutputLine();
      updatePrompt();
      setStatus("waiting for input", "busy");
      replInput.focus();
      return;
    }
    if (typeof data.line === "string") appendLine(data.line);
  }

  async function run(source) {
    if (activeRun) return;
    const program = typeof source === "string" ? source : code.value;
    const current = { id: newId("run"), controller: new AbortController(),
                      done: false, waiting: false, prompt: "" };
    activeRun = current;
    setRunning(true);
    clearOutput();
    resetCanvas();
    setStatus("running\u2026", "busy");
    try {
      const response = await fetch("/api/run", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "text/event-stream" },
        body: JSON.stringify({
          language: languageSelect.value,
          program: program,
          run: current.id,
          breakpoints: Array.from(breakpoints)
        }),
        signal: current.controller.signal
      });
      if (!response.ok) {
        const problem = await response.json().catch(function () { return {}; });
        appendLine(problem.error || ("HTTP " + response.status), "err");
        setStatus("error", "bad");
        return;
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const chunk = await reader.read();
        if (chunk.done) break;
        buffer += decoder.decode(chunk.value, { stream: true });
        let split = buffer.indexOf("\n\n");
        while (split >= 0) {
          handleFrame(buffer.slice(0, split), current);
          buffer = buffer.slice(split + 2);
          split = buffer.indexOf("\n\n");
        }
      }
      if (buffer.trim()) handleFrame(buffer, current);
      if (!current.done) {
        appendLine("?ERROR: the connection to the server closed before the program finished", "err");
        setStatus("connection lost", "bad");
      }
    } catch (err) {
      if (err.name === "AbortError") {
        setStatus("stopped", "bad");
      } else {
        appendLine("?ERROR: " + err.message + " (is the server still running?)", "err");
        setStatus("server unreachable", "bad");
      }
    } finally {
      activeRun = null;
      setRunning(false);
    }
  }

  function post(path, body) {
    return fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
  }

  function stop() {
    const current = activeRun;
    if (!current) return;
    setStatus("stopping\u2026", "busy");
    post("/api/stop", { run: current.id }).catch(function () {
      current.controller.abort();
    });
    // If the server does not answer promptly, drop the stream ourselves.
    setTimeout(function () {
      if (activeRun === current) current.controller.abort();
    }, 2000);
  }

  async function sendInput(text) {
    const current = activeRun;
    current.waiting = false;
    current.prompt = "";
    updatePrompt();
    setStatus("running\u2026", "busy");
    try {
      const response = await post("/api/input", { run: current.id, text: text });
      if (!response.ok) {
        const problem = await response.json().catch(function () { return {}; });
        appendLine(problem.error || ("HTTP " + response.status), "err");
      }
    } catch (err) {
      appendLine("?ERROR: " + err.message, "err");
    }
  }

  window.addEventListener("pagehide", function () {
    if (activeRun && navigator.sendBeacon) {
      navigator.sendBeacon("/api/stop", JSON.stringify({ run: activeRun.id }));
    }
  });

  // ---- console bar: REPL when idle, program input while running ---------
  // One session id per tab; the server keeps the interpreter (and its
  // variables) alive between lines.
  const replSession = newId("tab");
  const replHistory = [];
  let replHistoryIndex = 0;

  function updatePrompt() {
    const language = languageSelect.value || "BASIC";
    replBar.classList.toggle("input-mode", Boolean(activeRun));
    if (activeRun) {
      replPrompt.textContent = "?";
      replInput.placeholder = activeRun.waiting
        ? (activeRun.prompt.trim() || "The program is waiting for input") + " - type and press Enter"
        : "Input for the running program";
      return;
    }
    replPrompt.textContent = ">";
    replInput.placeholder = language === "BASIC"
      ? "Direct mode: PRINT 2+2, 10 PRINT \"HI\", LIST, RUN, HELP"
      : "Type a " + language + " statement and press Enter";
  }

  async function submitRepl(line) {
    replEcho(line);
    setStatus("evaluating\u2026", "busy");
    try {
      const response = await post("/api/repl", {
        session: replSession,
        language: languageSelect.value,
        line: line,
        program: code.value
      });
      const result = await response.json();
      if (!response.ok) {
        appendLine(result.error || ("HTTP " + response.status), "err");
        setStatus("error", "bad");
        return;
      }
      (result.output || []).forEach(function (text) { appendLine(text); });
      if (result.canvas) applyCanvasFrame(result.canvas);
      if (typeof result.program === "string") setProgram(result.program);
      setStatus(result.exit === 0 ? "ok" : "statement failed", result.exit === 0 ? "" : "bad");
      if (typeof result.run === "string") run(result.run);
    } catch (err) {
      appendLine("?ERROR: " + err.message, "err");
      setStatus("server unreachable", "bad");
    }
  }

  function replEcho(line) {
    appendLine((activeRun ? "" : "> ") + line, "echo");
  }

  replInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      const line = replInput.value;
      if (activeRun) {
        // Input lines are echoed by the server, in order with the output.
        replInput.value = "";
        sendInput(line);
        return;
      }
      if (!line.trim()) return;
      replInput.value = "";
      if (replHistory[replHistory.length - 1] !== line) replHistory.push(line);
      replHistoryIndex = replHistory.length;
      submitRepl(line);
      return;
    }
    if (event.key === "ArrowUp" && replHistory.length) {
      event.preventDefault();
      replHistoryIndex = Math.max(0, replHistoryIndex - 1);
      replInput.value = replHistory[replHistoryIndex];
      return;
    }
    if (event.key === "ArrowDown" && replHistory.length) {
      event.preventDefault();
      replHistoryIndex = Math.min(replHistory.length, replHistoryIndex + 1);
      replInput.value = replHistory[replHistoryIndex] || "";
    }
  });

  // ---- keyboard and buttons ---------------------------------------------

  code.addEventListener("input", onEdited);
  code.addEventListener("scroll", syncScroll);
  code.addEventListener("keydown", function (event) {
    if (event.key === "Tab" && !event.ctrlKey && !event.altKey && !event.metaKey) {
      event.preventDefault();
      // insertText keeps the edit undoable and fires "input".
      if (!document.execCommand("insertText", false, "  ")) {
        code.setRangeText("  ", code.selectionStart, code.selectionEnd, "end");
        onEdited();
      }
    }
  });
  document.addEventListener("keydown", function (event) {
    const mod = event.ctrlKey || event.metaKey;
    if (mod && event.key === "Enter") {
      event.preventDefault();
      run();
    } else if (mod && event.key === ".") {
      event.preventDefault();
      stop();
    } else if (mod && (event.key === "s" || event.key === "S")) {
      event.preventDefault();
      downloadSource();
    }
  });
  runButton.addEventListener("click", function () { run(); });
  stopButton.addEventListener("click", stop);
  clearButton.addEventListener("click", function () {
    clearOutput();
    replInput.focus();
  });
  saveButton.addEventListener("click", function () {
    const link = document.createElement("a");
    link.download = "timewarp-drawing.png";
    link.href = screen.toDataURL("image/png");
    link.click();
  });

  // ---- error history: click an error or BREAK line to jump to it ------
  output.addEventListener("click", function (event) {
    const target = event.target;
    if (!target || !target.textContent) return;
    const match = target.textContent.match(/(?:\?ERROR IN |BREAK IN )(\d+)/);
    if (match) jumpToLine(parseInt(match[1], 10));
  });

  // ---- pause / step / resume ------------------------------------------
  function postRunAction(path) {
    const current = activeRun;
    if (!current) return;
    post(path, { run: current.id }).catch(function () {});
  }
  pauseButton.addEventListener("click", function () {
    if (!activeRun) return;
    if (paused) {
      paused = false;
      postRunAction("/api/resume");
      setStatus("running\u2026", "busy");
    } else {
      paused = true;
      postRunAction("/api/pause");
      setStatus("paused", "busy");
    }
    updatePauseLabel();
  });
  stepButton.addEventListener("click", function () {
    if (!activeRun) return;
    postRunAction("/api/step");
    setStatus("stepping\u2026", "busy");
  });

  // ---- server-side drafts ---------------------------------------------
  async function loadDrafts() {
    try {
      const response = await fetch("/api/drafts");
      const data = await response.json();
      draftsSelect.innerHTML = '<option value="">Drafts&hellip;</option>';
      (data.drafts || []).forEach(function (entry) {
        const option = document.createElement("option");
        option.value = entry.name;
        option.textContent = entry.name;
        draftsSelect.appendChild(option);
      });
    } catch (err) { /* the drafts feature is optional */ }
  }

  async function saveDraft() {
    const name = draftName.value.trim();
    if (!name) {
      setStatus("type a draft name first", "bad");
      draftName.focus();
      return;
    }
    try {
      const response = await post("/api/drafts", {
        name: name, language: languageSelect.value, program: code.value
      });
      if (!response.ok) {
        const problem = await response.json().catch(function () { return {}; });
        setStatus(problem.error || ("HTTP " + response.status), "bad");
        return;
      }
      savedSource = code.value;
      setStatus("saved draft " + name);
      draftName.value = "";
      loadDrafts();
    } catch (err) {
      setStatus("could not save draft: " + err.message, "bad");
    }
  }

  async function openDraft(name) {
    if (!name) return;
    draftsSelect.value = "";
    if (!confirmReplace()) return;
    try {
      const response = await fetch("/api/drafts/" + encodeURIComponent(name));
      const data = await response.json();
      if (!response.ok || data.error) {
        setStatus(data.error || ("HTTP " + response.status), "bad");
        return;
      }
      if (data.language) setLanguage(data.language);
      setProgram(data.program);
      savedSource = data.program;
      setStatus("opened draft " + name);
    } catch (err) {
      setStatus("could not open draft: " + err.message, "bad");
    }
  }

  let deleteArmed = false;
  async function deleteDraft() {
    const name = draftsSelect.value;
    if (!name) return;
    if (!deleteArmed) {
      deleteArmed = true;
      deleteDraftButton.textContent = "Really delete?";
      setStatus("click Delete draft again to confirm", "busy");
      setTimeout(function () {
        deleteArmed = false;
        deleteDraftButton.textContent = "Delete draft";
      }, 3000);
      return;
    }
    deleteArmed = false;
    deleteDraftButton.textContent = "Delete draft";
    try {
      const response = await fetch("/api/drafts/" + encodeURIComponent(name), { method: "DELETE" });
      if (!response.ok) {
        const problem = await response.json().catch(function () { return {}; });
        setStatus(problem.error || ("HTTP " + response.status), "bad");
        return;
      }
      setStatus("deleted draft " + name);
      loadDrafts();
    } catch (err) {
      setStatus("could not delete draft: " + err.message, "bad");
    }
  }

  saveDraftButton.addEventListener("click", saveDraft);
  deleteDraftButton.addEventListener("click", deleteDraft);
  draftsSelect.addEventListener("change", function () {
    openDraft(draftsSelect.value);
  });
  themeSelect.addEventListener("change", function () {
    applyTheme(themeSelect.value);
  });

  (function enableSplitDrag() {
    const divider = document.getElementById("divider");
    const leftPane = document.getElementById("left-pane");
    const workspace = document.querySelector("main");
    let dragging = false;
    let share = 50;

    function setShare(value) {
      share = Math.min(85, Math.max(15, value));
      leftPane.style.flex = "0 0 " + share + "%";
      divider.setAttribute("aria-valuenow", String(Math.round(share)));
    }

    divider.addEventListener("pointerdown", function (event) {
      dragging = true;
      divider.setPointerCapture(event.pointerId);
      event.preventDefault();
    });
    divider.addEventListener("pointermove", function (event) {
      if (!dragging) return;
      const box = workspace.getBoundingClientRect();
      setShare(((event.clientX - box.left) / box.width) * 100);
    });
    function stopDrag(event) {
      if (!dragging) return;
      dragging = false;
      divider.releasePointerCapture(event.pointerId);
    }
    divider.addEventListener("pointerup", stopDrag);
    divider.addEventListener("pointercancel", stopDrag);
    divider.addEventListener("keydown", function (event) {
      if (event.key === "ArrowLeft") { setShare(share - 5); event.preventDefault(); }
      if (event.key === "ArrowRight") { setShare(share + 5); event.preventDefault(); }
    });
  }());

  examplesSelect.addEventListener("change", function () {
    openExample(examplesSelect.value);
  });
  languageSelect.addEventListener("change", onLanguageChanged);

  // ---- start-up ---------------------------------------------------------
  initThemes();
  const shared = shareFromHash();
  const stored = shared || restore();
  if (stored && typeof stored.program === "string" && stored.program.trim()) {
    code.value = stored.program;
  }
  savedSource = code.value;
  syncGutter();
  resetCanvas();
  updatePrompt();
  loadLanguages(stored && stored.language).catch(function (err) {
    setStatus("server unreachable: " + err.message, "bad");
  });
  loadExamples().catch(function () {});
  loadDrafts();
}());
</script>
</body>
</html>
